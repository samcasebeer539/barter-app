# Lints and type-checks the app and runs its Jest tests (tests/) on every push and
# pull request that touches app code. Firebase and the server are mocked, so no secrets or
# .env are needed.
name: App tests

on:
  push:
    paths-ignore:
      - "backend/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "backend/**"
      - "**.md"
  workflow_dispatch:

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint, no warnings allowed)
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Run tests
        run: npx jest --ci

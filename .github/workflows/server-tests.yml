# Runs the Flask server's tests (backend/tests) on every push and pull
# request that touches the backend, twice:
#   fake-mongo  in-memory mongomock (the same way they run on a laptop)
#   real-mongo  against a real MongoDB server started just for this run
# Firebase is stubbed and the real Atlas database is never touched, so no
# secrets or .env are needed.
name: Server tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/server-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/server-tests.yml"
  workflow_dispatch:

jobs:
  fake-mongo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

  real-mongo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGO_URI: mongodb://localhost:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

# Runs the Flask server's tests (backend/tests) on every push and pull
# request that touches the backend. The tests use a fake Mongo and stubbed
# Firebase, so no secrets or .env are needed.
name: Server tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/server-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/server-tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q
